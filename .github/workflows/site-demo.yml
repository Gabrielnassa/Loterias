# Demonstração estática para a RAIZ de um domínio (basePath vazio), publicada pronta no branch órfão
# "site-demo": só os arquivos do build (index.html, _next/, .htaccess...), sem o código do repositório.
# A Hostinger publica esse branch em radar.nassatech.com.br com auto-deploy (Git na hospedagem comum).
# Cada atualização substitui o branch inteiro (force push, 1 commit só). O GitHub Pages continua no
# workflow pages.yml, com o caminho /Loterias.
name: Demonstração (branch site-demo, raiz do domínio)

on:
  push:
    branches: [claude/peaceful-noether-hs112s]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site-demo.yml'
  workflow_dispatch:
  schedule:
    # todo dia às 09:23 UTC (06:23 em São Paulo): refaz os dados simulados da demonstração
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: site-demo
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build da demonstração na raiz (basePath vazio)
        run: DEMO_BASE_PATH= pnpm --filter @radar/demo build
      - name: .htaccess (rotas limpas, 404, cache) e conferência
        run: |
          bash apps/demo/scripts/htaccess.sh ''
          cd apps/demo/out
          test -f index.html && test -f 404.html && test -f .htaccess && test -f _next/static/.htaccess
          # assets na raiz (/_next/...), nunca em /Loterias/_next/...
          grep -q '"/_next/' index.html
          if grep -q '/Loterias/_next/' index.html; then echo "build com o caminho errado" >&2; exit 1; fi
          echo "$(find . -type f | wc -l) arquivos, $(du -sh . | cut -f1)"
      - name: Publicar no branch órfão site-demo (force push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/demo/out
          git init -q -b site-demo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demonstração estática na raiz (${GITHUB_SHA::7}, $(date -u +%F))"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-demo:site-demo
          echo "branch site-demo: $(git rev-parse --short HEAD)"
